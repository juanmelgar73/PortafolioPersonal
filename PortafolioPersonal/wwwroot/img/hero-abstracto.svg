<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Composición abstracta violeta y azul con las iniciales JM">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#512BD4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Halo claro -->
  <path d="M80 200 C90 90 230 20 360 40 C500 60 570 190 540 320 C510 440 380 500 260 490 C130 480 70 320 80 200 Z" fill="#ddd6fe"/>

  <!-- Órbita -->
  <ellipse cx="300" cy="260" rx="270" ry="120" transform="rotate(-22 300 260)" fill="none" stroke="#512BD4" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- Puntos -->
  <rect x="440" y="40" width="130" height="110" fill="url(#dots)"/>

  <!-- Formas principales -->
  <path d="M120 250 C100 140 210 60 320 70 C440 80 520 170 500 280 C480 390 380 450 270 440 C170 430 135 350 120 250 Z" fill="#512BD4"/>
  <path d="M60 330 C40 250 110 200 180 230 C250 260 270 340 230 400 C190 460 90 450 60 330 Z" fill="#1565C0" opacity="0.92"/>

  <!-- Decoración -->
  <circle cx="500" cy="118" r="34" fill="#F59E0B"/>
  <circle cx="92" cy="118" r="26" fill="none" stroke="#512BD4" stroke-width="6"/>
  <circle cx="470" cy="440" r="12" fill="#1565C0" opacity="0.6"/>

  <!-- Iniciales -->
  <g font-family="Arial Black, Segoe UI, Arial, sans-serif" font-weight="900" font-size="210" text-anchor="middle">
    <text x="308" y="338" fill="#0b3a70" opacity="0.75">JM</text>
    <text x="300" y="330" fill="#ffffff">JM</text>
  </g>
</svg>
