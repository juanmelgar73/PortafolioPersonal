<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Ilustración de editor de código .NET">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1565C0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <circle cx="270" cy="215" r="190" fill="url(#bg)"/>
  <circle cx="450" cy="90" r="14" fill="#512BD4" fill-opacity="0.25"/>
  <circle cx="60" cy="350" r="22" fill="#1565C0" fill-opacity="0.2"/>

  <!-- Ventana del editor -->
  <g filter="url(#sh)">
    <rect x="50" y="80" width="400" height="260" rx="16" fill="#1f2937"/>
    <path d="M50 96 a16 16 0 0 1 16 -16 h368 a16 16 0 0 1 16 16 v22 h-400 z" fill="#111827"/>
    <circle cx="74" cy="99" r="6" fill="#f87171"/>
    <circle cx="94" cy="99" r="6" fill="#fbbf24"/>
    <circle cx="114" cy="99" r="6" fill="#34d399"/>
    <text x="250" y="103" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9ca3af">Program.cs</text>
  </g>

  <!-- Código -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="74" y="152"><tspan fill="#6b7280">// Juan Melgar</tspan></text>
    <text x="74" y="182"><tspan fill="#c084fc">var</tspan><tspan fill="#e5e7eb"> dev = </tspan><tspan fill="#c084fc">new</tspan><tspan fill="#60a5fa"> Analista</tspan><tspan fill="#e5e7eb">();</tspan></text>
    <text x="74" y="212"><tspan fill="#e5e7eb">dev.Stack = </tspan><tspan fill="#86efac">".NET"</tspan><tspan fill="#e5e7eb">;</tspan></text>
    <text x="74" y="242"><tspan fill="#e5e7eb">dev.Pasion = </tspan><tspan fill="#86efac">"Resolver"</tspan><tspan fill="#e5e7eb">;</tspan></text>
    <text x="74" y="272"><tspan fill="#e5e7eb">dev.</tspan><tspan fill="#fbbf24">Construir</tspan><tspan fill="#e5e7eb">(ideas);</tspan></text>
    <rect x="74" y="288" width="9" height="18" fill="#60a5fa" opacity="0.9"/>
  </g>

  <!-- Etiquetas flotantes -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle">
    <g transform="translate(388 46) rotate(6)">
      <rect width="84" height="42" rx="12" fill="url(#g)"/>
      <text x="42" y="28" fill="#ffffff">.NET</text>
    </g>
    <g transform="translate(22 300) rotate(-7)">
      <rect width="62" height="42" rx="12" fill="#ffffff" stroke="#512BD4" stroke-width="2"/>
      <text x="31" y="28" fill="#512BD4">C#</text>
    </g>
    <g transform="translate(398 318) rotate(5)">
      <rect width="72" height="42" rx="12" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
      <text x="36" y="28" fill="#1565C0">SQL</text>
    </g>
  </g>
</svg>
